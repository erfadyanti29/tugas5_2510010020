<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk Toko</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==================== NAVBAR (position: fixed) ==================== -->
    <header class="navbar">
        <div class="nav-container">
            <h1 class="logo">TokoErfa</h1>
            <ul class="nav-links">
                <li><a href="#">Beranda</a></li>
                <li><a href="#katalog">Produk</a></li>
                <li><a href="#">Kontak</a></li>
            </ul>
        </div>
    </header>

    <!-- ==================== SUB-JUDUL KATEGORI (position: sticky) ==================== -->
    <div class="sticky-category" id="katalog">
        <h2>Katalog Produk Pilihan Terbaik</h2>
    </div>

    <!-- ==================== KONTEN UTAMA & KARTU PRODUK ==================== -->
    <main class="main-container">
        <div class="product-grid">
            
            <!-- Kartu Produk 1 -->
            <div class="product-card">
                <span class="badge">Diskon</span>
                <div class="img-container">
                    <img src="https://picsum.photos/seed/prod1/300/200" alt="Produk 1">
                </div>
                <div class="product-info">
                    <h3>Sepatu Sneakers Casual</h3>
                    <p class="price">Rp 299.000</p>
                    <button class="buy-btn">Beli Sekarang</button>
                </div>
            </div>

            <!-- Kartu Produk 2 -->
            <div class="product-card">
                <span class="badge new">Baru</span>
                <div class="img-container">
                    <img src="https://picsum.photos/seed/prod2/300/200" alt="Produk 2">
                </div>
                <div class="product-info">
                    <h3>Tas Ransel Laptop</h3>
                    <p class="price">Rp 185.000</p>
                    <button class="buy-btn">Beli Sekarang</button>
                </div>
            </div>

            <!-- Kartu Produk 3 -->
            <div class="product-card">
                <span class="badge">Diskon</span>
                <div class="img-container">
                    <img src="https://picsum.photos/seed/prod3/300/200" alt="Produk 3">
                </div>
                <div class="product-info">
                    <h3>Jam Tangan Minimalis</h3>
                    <p class="price">Rp 245.000</p>
                    <button class="buy-btn">Beli Sekarang</button>
                </div>
            </div>

            <!-- Kartu Produk 4 -->
            <div class="product-card">
                <span class="badge new">Baru</span>
                <div class="img-container">
                    <img src="https://picsum.photos/seed/prod4/300/200" alt="Produk 4">
                </div>
                <div class="product-info">
                    <h3>Kacamata Anti Radiasi</h3>
                    <p class="price">Rp 95.000</p>
                    <button class="buy-btn">Beli Sekarang</button>
                </div>
            </div>

        </div>
    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="site-footer">
        <p>&copy; 2026 TokoErfa - 2510010020. Hak Cipta Dilindungi.</p>
    </footer>

</body>
</html>
